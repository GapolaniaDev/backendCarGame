---
# Reference of the runtime config that docker-compose.yml's entrypoint
# renders into /tmp/nakama.yml from env vars before starting Nakama.
# Nakama does NOT expand env vars in YAML, so secrets are templated in via
# a heredoc in the entrypoint script and written to /tmp/nakama.yml.
#
# Don't mount this file directly — it's only here as documentation.

socket:
  server_key: "${NAKAMA_SERVER_KEY}"
  port: 8081             # HTTP/gateway on 8081 for Cloudflare tunnel
  address: "0.0.0.0"

runtime:
  gwp_secret: "${NAKAMA_GWP_SECRET}"
  http_key: "${NAKAMA_RUNTIME_HTTP_KEY}"
  # Read by the modules as ctx.env (plan T-24, T-25). Empty = not configured.
  env:
    - "IAP_MOCK=${IAP_MOCK:-false}"                # true only in dev / CI
    - "IAP_APPLE_SHARED_SECRET=${IAP_APPLE_SHARED_SECRET:-}"
    - "IAP_GOOGLE_CLIENT_EMAIL=${IAP_GOOGLE_CLIENT_EMAIL:-}"
    - "IAP_GOOGLE_PRIVATE_KEY=${IAP_GOOGLE_PRIVATE_KEY:-}"
    - "IAP_GOOGLE_PACKAGE_NAME=${IAP_GOOGLE_PACKAGE_NAME:-}"
    - "LEVELPLAY_S2S_PRIVATE_KEY=${LEVELPLAY_S2S_PRIVATE_KEY:-}"  # T-25; empty = callbacks rejected
    - "RACE_SERVER_SECRET=${RACE_SERVER_SECRET:-}"                # dedicated race servers; empty = rs_* RPCs rejected

# Nakama's native purchase validation, same store credentials (T-24).
iap:
  apple:
    shared_password: "${IAP_APPLE_SHARED_SECRET:-}"
  google:
    client_email: "${IAP_GOOGLE_CLIENT_EMAIL:-}"
    private_key: "${IAP_GOOGLE_PRIVATE_KEY:-}"
    package_name: "${IAP_GOOGLE_PACKAGE_NAME:-}"

database:
  address:
    - "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"

session:
  encryption_key: "${NAKAMA_SESSION_ENCRYPTION_KEY}"
  refresh_encryption_key: "${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY}"
  token_expiry_sec: 7200            # 2 h session token (plan D-02)
  refresh_token_expiry_sec: 604800  # 7 day refresh token (plan D-02)

logger:
  level: "info"

console:
  port: 8090                       # admin console (separate port)
  username: "${NAKAMA_CONSOLE_USER}"
  password: "${NAKAMA_CONSOLE_PASSWORD}"